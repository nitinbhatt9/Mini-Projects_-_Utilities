<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login UI</title>
    <link rel="stylesheet" href="code-with-fit-Bhatt.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <div class="login-container">
        <div class="avatar-line">
            <span></span>
            <div class="avatar">
                <i class="fa-duotone fa-solid fa-user-secret"></i>
            </div>
            <span></span>
        </div>

        <form class="login-form">
            <div class="input-box">
                <i class="fa-solid fa-users"></i>
                <input type="text" placeholder="UESRNAME">
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" placeholder="********">
            </div>

            <button type="submit">LOGIN</button>

            <div class="options">
                <label for="remember">
                    <input type="checkbox" id="remember" name="rememberMe" checked>
                    <span class="check"></span>
                    Remember Me
                </label>

                <a href="#">Forgot Your Password?</a>
            </div>
        </form>
    </div>
</body>

</html>
